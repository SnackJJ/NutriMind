[project]
name = "nutrimind"
version = "0.1.0"
description = "NutriMind Agent"
authors = [{ name = "NutriAgent Team" }]
dependencies = [
    "transformers",
    "openai",
    "httpx",
    "pydantic",
    "loguru",
    "pyyaml",
    "python-dotenv",
    "dashscope",
    "tenacity",
]
requires-python = ">=3.10"

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu128"]

# NutriEnv is consumed read-only as a benchmark + library (ADR-012). v2 pins the
# local sibling `../nutri-env-lab` (ticket 023). The wheel build drops
# `nutrienv/env/` (a bare `env/` line in the lab's .gitignore is honoured by
# hatchling), so a plain wheel / git+ install produces a broken package. Install
# editable in *strict* PEP 660 mode, which redirects to the source tree:
#   uv pip install -e ../nutri-env-lab --config-settings editable_mode=strict
# (see scripts/setup_nutrienv.sh). `uv sync` of the whole project is separately
# blocked today by the unrelated `vllm==0.12.0` pin in the `inference` /
# `training` extras.
[tool.uv.sources]
nutrienv = { path = "../nutri-env-lab", editable = true }

[project.optional-dependencies]
data-factory = [
    "nutrienv==1.0.0",   # pinned rev recorded in configs/data_factory.yaml (nutrienv_rev)
    "pytest>=8",
]
retrieval = [
    "chromadb",
    "sentence-transformers",
    "rank-bm25",
    "beautifulsoup4",
    "lxml",
    "nltk",
    "docling",
]
inference = [
    "torch==2.9.0",
    "vllm==0.12.0",
]
training = [
    "torch==2.9.0",
    "trl>=0.12.0",
    "peft",
    "datasets",
    "verl>=0.5.0",
    "vllm==0.12.0",
    "pyarrow>=19.0.0",
    "ray>=2.41.0",
    "tensordict>=0.8.0,<=0.10.0,!=0.9.0",
    "numpy<2.0.0",
    "wandb>=0.16.0",
]

# Ticket 003: pytest from the repo root discovers the suite (incl.
# tests/training/data_factory/) with no -o flags.
[tool.pytest.ini_options]
testpaths = ["tests"]
