# First real RL run: 16 prompts x 8 rollouts per step, LoRA lr at ~10x the full-parameter value.
defaults:
  - grpo_v2_a800_fast
  - _self_

data:
  train_batch_size: 16

actor_rollout_ref:
  actor:
    ppo_mini_batch_size: 16
    calculate_entropy: true
    optim:
      lr: 2.0e-5
  rollout:
    max_num_seqs: 128
    gpu_memory_utilization: 0.6
    agent:
      num_workers: 8

trainer:
  experiment_name: a800-bs16-lr2e-5
  total_training_steps: 40
  test_freq: 10
  save_freq: 10
  max_actor_ckpt_to_keep: 2
  val_before_train: false
  default_local_dir: data/rl_runs/grpo_v2_a800_bs16
  rollout_data_dir: data/rl_runs/grpo_v2_a800_bs16/rollouts
