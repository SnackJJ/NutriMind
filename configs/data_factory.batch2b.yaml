# NutriMind v2 data factory — batch 2b: update→recommend top-up (30), 2026-10-01.
#
# The `composite` family's queue is task_id-sorted, so its quota fills with
# log→recommend and never reaches update→recommend (batch 1: 70 of 70; batch 2
# the same). This run authors that shape on its own family quota, into its own
# output dir, alongside batch 2 (same seed_offset; the family has its own seed
# base). Everything else is configs/data_factory.batch2.yaml.
#
# max_intents: 2x wave cap = 6 x 30 = 180. Budget: ~$0.03/task -> $2.

# nutrienv_rev is single-sourced from the pin block below (the pinned release tree);
# the loader exposes it as DataFactoryConfig.nutrienv_rev. Keep the rev the
# FIRST 40-hex string in this file — CI resolves the pin from it.

# NutriEnv (../nutri-env-pin) is consumed read-only (ADR-012): a detached worktree
# of the public repo at tag v1.1.1, pinned to an exact commit. The smoke test
# asserts the installed source tree's git HEAD equals this value. The older
# ../nutri-env-lab@47367d9 pin is v2 experiment history (scorer s7-amdr-windows,
# exam nutrienv-v1.1-gold); numbers measured there are NOT comparable with this one.
nutrienv:
  repo: "https://github.com/SnackJJ/NutriEnv"
  rev: "f4d70b2e9affc277aa1afd8e83d26bce65a20b04"     # nutrienv_rev
  install: "uv pip install -e ../nutri-env-pin --config-settings editable_mode=strict"
  note: >
    Default (compat) editable / wheel / git+ installs drop nutrienv/env/ because
    the repo's .gitignore has a bare `env/` line that hatchling honours. Use strict
    PEP 660 editable mode (redirects to the source tree). If a clean wheel is ever
    needed, packaging must be fixed upstream (anchor the ignore as `/env/`,
    or add `[tool.hatch.build] artifacts = ["src/nutrienv/env/**"]`). NutriMind
    never patches the lab tree.

target: sft                      # sft | rlvr | eval | all (spec §7)

# Teacher + expander channel: DeepSeek official API (OpenAI-compatible).
# Model id is the one GET /models returned on 2026-09-29 (`deepseek-flash` =
# DeepSeek-V4.1-Flash). The build does NOT read .env files; export
# DEEPSEEK_API_KEY before a live run (local source: NutriBuddy .env.local).
#
# Command Code is optional, selected by --teacher commandcode / --expander
# commandcode. It answered on 2026-09-29. Thinking and temperature stay on the
# blocks below; the commandcode: block only swaps model, endpoint, and key.
teacher:
  model_id: "deepseek-flash"
  endpoint: "https://api.deepseek.com/chat/completions"
  credential_env: "DEEPSEEK_API_KEY"
  thinking: {type: "enabled"}
  temperature_first: 0.0         # attempt 1 (spec §16 / OQ-11). Ignored while thinking is on.
  temperature_retry: 0.7         # attempts 2..k. Ignored while thinking is on.
  per_turn_timeout_s: 60

expander:                        # same official endpoint + credential as the teacher
  model_id: "deepseek-flash"
  endpoint: "https://api.deepseek.com/chat/completions"
  credential_env: "DEEPSEEK_API_KEY"
  thinking: {type: "disabled"}   # structured {query, foods} JSON; no reasoning needed
  timeout_s: 60
  parse_retries: 1               # attempts = parse_retries + 1 (spec §16)

commandcode:
  model_id: "deepseek/deepseek-v4.1-flash"
  endpoint: "https://api.commandcode.ai/provider/v1/chat/completions"
  credential_env: "COMMANDCODE_API_KEY"

# est_usd = Σ over teacher, expander of
#   ((prompt - cached)·input + cached·cached_input + completion·output) / 1e6
# where completion includes reasoning tokens. DeepSeek-V4.1-Flash list price,
# USD per 1M tokens, read 2026-09-29 from
# https://api-docs.deepseek.com/quick_start/pricing
# Peak is exactly 2× off-peak. Peak hours are weekdays 01:00–04:00 and
# 06:00–10:00 UTC. The meter does not subtract Chinese public holidays, and a
# run that crosses a boundary reprices the accumulated total at the later tier.
# The same card prices the optional Command Code channel; that is the DeepSeek
# list, not a Command Code invoice.
pricing:
  currency: USD
  fx_as_of: "2026-09-29"
  peak_hours_utc: ["01:00-04:00", "06:00-10:00"]
  off_peak:
    teacher:  {input_per_mtok: 0.15, cached_input_per_mtok: 0.003, output_per_mtok: 0.60}
    expander: {input_per_mtok: 0.15, cached_input_per_mtok: 0.003, output_per_mtok: 0.60}
  peak:
    teacher:  {input_per_mtok: 0.30, cached_input_per_mtok: 0.006, output_per_mtok: 1.20}
    expander: {input_per_mtok: 0.30, cached_input_per_mtok: 0.006, output_per_mtok: 1.20}

# N counts accepted Pass task_ids after intra-family semantic_key dedup (spec §10).
# teacher_k = 6 is the pinned value (spec §2.1 preserves it for the 3-leg; applied
# family-wide pending the design-doc reconstruction, ticket 021).
families:
  composite_update_recommend:    # update→recommend on its own quota
    target_n: 30
    teacher_k: 6
    over_generate_x: 3.0
    gram_anchor: false

max_seq_tokens: 20000            # ADR-011: 20k full-log; over → serialize.too_long
plan_max_tokens: 80              # ~80-token hard plan truncation (ADR-011)
final_plan_max_tokens: 300       # hand-in turn (ADR-011 amendment, 2026-10-01)
seed_offset: 100000              # batch 2: new pools, disjoint from batch 1's seeds
tokenizer_name: null             # student tokenizer id, or null → char heuristic
max_intents: 180                # 2x wave cap (see header)
usd_budget: 2.0                  # see header
on_budget: stop                  # warn | stop (spec §16)
output_dir: data/student/v2-batch2b-update-rec
rubric_version: v2-r1
reward_version: v2-r1
catalog_path: null               # null → nutrienv load_catalog() gold default
exam_split_path: null            # null → nutrienv.bench.EXAM_SPLIT_PATH
