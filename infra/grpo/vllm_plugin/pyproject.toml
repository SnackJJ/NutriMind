[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutrimind-vllm-compat"
version = "0.1.0"
requires-python = ">=3.12"

[project.entry-points."vllm.general_plugins"]
nutrimind_qwen35_text = "nutrimind_vllm_compat:register"

[tool.setuptools]
py-modules = ["nutrimind_vllm_compat", "nutrimind_vllm_compat_model"]
